<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IT Code Mapper</title>
  <style>
    :root { --primary: #111; --success: #0a7; --bg: #f4f4f7; }
    body { font-family: system-ui, -apple-system, Arial; margin: 0; background: var(--bg); color: #111; line-height: 1.5; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 16px; }
    
    /* Hero Output Area */
    .bigOut { border-radius: 20px; padding: 30px 20px; text-align: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 20px; position: sticky; top: 10px; z-index: 10; }
    .bigGood { background: var(--success); color: #fff; box-shadow: 0 8px 24px rgba(0,160,110,0.4); transform: scale(1.02); }
    .bigIdle { background: #fff; color: #333; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .bigLabel { font-size: 13px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .bigValue { margin-top: 10px; font-size: 48px; font-weight: 850; line-height: 1; word-break: break-all; }
    
    /* Main Grid */
    .card { background: #fff; border: 1px solid #ddd; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .video-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .roiBox { border: 2px dashed rgba(255,255,255,0.5); position: absolute; inset: 20% 15%; border-radius: 12px; pointer-events: none; }
    
    /* List Layout */
    .list-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    textarea { width: 100%; border: 1px solid #ccc; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 12px; box-sizing: border-box; background: #fafafa; }
    
    /* Interface Elements */
    .status-bar { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 10px; color: #666; padding: 0 4px; }
    .btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    button { padding: 12px 18px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; }
    button.primary { background: var(--primary); color: #fff; border: none; }
    .btn-sync { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; font-size: 11px; padding: 4px 8px; }

    /* Settings Area */
    details { margin-top: 30px; padding-bottom: 50px; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; background: #eee; padding: 15px; border-radius: 12px; }
    label { font-size: 11px; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="status-bar">
    <div>Status: <span id="status">Initializing...</span></div>
    <div>Latency: <span id="lastMs">0ms</span></div>
  </div>

  <div id="bigOut" class="bigOut bigIdle">
    <div class="bigLabel">Internal System Code</div>
    <div id="returnedB" class="bigValue">READY</div>
    <div id="matchDetails" style="margin-top:12px; font-size: 14px; display: none;">
      Matched: <strong id="matchedA"></strong>
    </div>
  </div>

  <div class="card">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="roiBox"></div>
    </div>
    <div class="btn-row">
      <button class="primary" id="scanBtn">Manual Scan</button>
      <button id="toggleAuto">Stop Auto</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-weight:700;">Mapping Lists</div>
      <div style="display:flex; gap:5px;">
        <button class="btn-sync" id="syncCsv">Sync from CSV</button>
        <button class="btn-sync" onclick="el('fileIn').click()">Upload</button>
      </div>
      <input type="file" id="fileIn" accept=".csv" style="display:none">
    </div>
    <div class="list-grid">
      <div>
        <label>External Vendor Code</label>
        <textarea id="listA" rows="8" placeholder="List A"></textarea>
      </div>
      <div>
        <label>Our System Code</label>
        <textarea id="listB" rows="8" placeholder="List B"></textarea>
      </div>
    </div>
  </div>

  <details>
    <summary style="text-align:center; color:#888; cursor:pointer; font-size:13px;">Power User Settings</summary>
    <div class="settings-grid">
      <div>
        <label>Scan Mode</label>
        <select id="mode" style="width:100%; padding:8px; border-radius:5px;">
          <option value="ocr">OCR (Text)</option>
          <option value="barcode">Barcode Detector</option>
        </select>
      </div>
      <div>
        <label>Scan Interval (ms)</label>
        <input id="interval" type="number" value="1000" style="width:100%; padding:8px; box-sizing:border-box;">
      </div>
      <div>
        <label>Min Match Score (0.1 - 1.0)</label>
        <input id="minScore" type="number" value="0.8" step="0.1" style="width:100%; padding:8px; box-sizing:border-box;">
      </div>
      <div>
        <label>OCR Contrast</label>
        <input id="contrast" type="range" min="0" max="60" value="25" style="width:100%;">
      </div>
    </div>
    <pre id="debugLog" style="font-size:10px; background:#333; color:#0f0; padding:10px; margin-top:10px; border-radius:8px; overflow:auto; max-height:100px;">Debug info...</pre>
  </details>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  const el = (id) => document.getElementById(id);
  const video = el("video");
  const canvas = el("canvas");
  const ctx = canvas.getContext("2d");

  let stream = null;
  let timer = null;
  let isBusy = false;
  let autoRunning = true;

  // --- 1. Data Loading & CSV Support ---
  
  async function fetchMapping() {
    el("status").textContent = "Fetching CSV...";
    try {
      const resp = await fetch('mapping.csv?nocache=' + Date.now());
      if (resp.ok) {
        const text = await resp.text();
        parseAndStore(text);
        el("status").innerHTML = "<span style='color:green'>CSV Synced</span>";
      } else {
        el("status").textContent = "No mapping.csv found";
      }
    } catch (e) {
      el("status").textContent = "Sync failed";
    }
  }

  function parseAndStore(csv) {
    const lines = csv.split(/\r?\n/).filter(l => l.trim().includes(','));
    const a = [], b = [];
    lines.forEach(line => {
      const parts = line.split(',');
      a.push(parts[0].trim());
      b.push(parts[1].trim());
    });
    el("listA").value = a.join('\n');
    el("listB").value = b.join('\n');
    saveToLocal();
  }

  function saveToLocal() {
    localStorage.setItem('mapA', el("listA").value);
    localStorage.setItem('mapB', el("listB").value);
  }

  // --- 2. Camera & OCR Logic ---

  async function init() {
    // Load local storage first
    if (localStorage.getItem('mapA')) {
      el("listA").value = localStorage.getItem('mapA');
      el("listB").value = localStorage.getItem('mapB');
    } else {
      await fetchMapping();
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 } }
      });
      video.srcObject = stream;
      el("status").textContent = "Camera Ready";
      startAuto();
    } catch (err) {
      el("status").innerHTML = "<span style='color:red'>Camera Denied</span>";
    }
  }

  async function scan() {
    if (isBusy || !stream) return;
    isBusy = true;
    const tStart = performance.now();

    try {
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w; canvas.height = h;

      // ROI Logic (The center box)
      const sx = w * 0.15, sy = h * 0.2, sw = w * 0.7, sh = h * 0.6;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);

      // Pre-process (Contrast boost)
      if (el("mode").value === "ocr") {
        const img = ctx.getImageData(0,0,w,h);
        const d = img.data;
        const contrast = (Number(el("contrast").value) + 100) / 100;
        for (let i=0; i<d.length; i+=4) {
          for (let j=0; j<3; j++) d[i+j] = ((d[i+j] / 255 - 0.5) * contrast + 0.5) * 255;
        }
        ctx.putImageData(img, 0, 0);
      }

      let text = "";
      if (el("mode").value === "barcode" && "BarcodeDetector" in window) {
        const detector = new BarcodeDetector();
        const found = await detector.detect(canvas);
        text = found[0]?.rawValue || "";
      } else {
        const { data } = await Tesseract.recognize(canvas, 'eng');
        text = data.text;
      }

      el("debugLog").textContent = "Last Read: " + text.replace(/\n/g, ' ');

      // Matching
      const cleanRead = text.toLowerCase().replace(/[^a-z0-9]/g, '');
      const listA = el("listA").value.split('\n').map(x => x.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
      const listB = el("listB").value.split('\n').map(x => x.trim());
      
      let foundIdx = -1;
      if (cleanRead.length > 1) {
        foundIdx = listA.findIndex(item => item && cleanRead.includes(item));
      }

      if (foundIdx > -1) {
        handleSuccess(listB[foundIdx], el("listA").value.split('\n')[foundIdx]);
      } else {
        el("returnedB").textContent = "SCANNING...";
        el("bigOut").className = "bigOut bigIdle";
        el("matchDetails").style.display = "none";
      }

    } catch (e) {
      console.error(e);
    } finally {
      el("lastMs").textContent = Math.round(performance.now() - tStart) + "ms";
      isBusy = false;
    }
  }

  function handleSuccess(myCode, theirCode) {
    el("returnedB").textContent = myCode;
    el("matchedA").textContent = theirCode;
    el("matchDetails").style.display = "block";
    el("bigOut").className = "bigOut bigGood";

    // Success Freeze: Stop scanning for 2.5 seconds to avoid jumping
    if (autoRunning) {
      stopAuto(true); 
      setTimeout(() => { if(autoRunning) startAuto(); }, 2500);
    }
  }

  function startAuto() {
    if (timer) clearInterval(timer);
    autoRunning = true;
    el("toggleAuto").textContent = "Stop Auto";
    timer = setInterval(scan, el("interval").value);
  }

  function stopAuto(isTemporary = false) {
    clearInterval(timer);
    timer = null;
    if (!isTemporary) {
      autoRunning = false;
      el("toggleAuto").textContent = "Start Auto";
    }
  }

  // --- 3. Listeners ---

  el("toggleAuto").addEventListener("click", () => autoRunning ? stopAuto() : startAuto());
  el("scanBtn").addEventListener("click", scan);
  el("syncCsv").addEventListener("click", fetchMapping);
  
  el("fileIn").addEventListener("change", (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => parseAndStore(ev.target.result);
    reader.readAsText(e.target.files[0]);
  });

  [el("listA"), el("listB")].forEach(t => t.addEventListener("input", saveToLocal));

  // Boot
  window.addEventListener("load", init);
</script>
</body>
</html>
