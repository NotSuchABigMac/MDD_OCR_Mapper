<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>DIN 1451 Mapper</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/din-1451">
  <style>
    :root { --primary: #111; --success: #0a7; --bg: #f0f2f5; --font-din: 'DIN 1451 Std', 'DIN 1451', sans-serif; }
    body { font-family: -apple-system, system-ui; margin: 0; background: var(--bg); overscroll-behavior: none; }
    
    .wrap { max-width: 600px; margin: 0 auto; padding: 12px; }
    
    /* Result Card styled with DIN 1451 */
    .result-card {
      position: sticky; top: 10px; z-index: 100;
      background: #fff; border-radius: 12px; padding: 16px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 2px solid #ddd;
      margin-bottom: 16px;
    }
    .result-card.success { background: var(--success); color: white; border-color: var(--success); }
    
    .res-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 4px; }
    .res-value { font-family: var(--font-din); font-size: 40px; font-weight: 500; word-break: break-all; }

    /* Narrow Slit Scan View */
    .cam-card {
      background: #000; border-radius: 12px; overflow: hidden; position: relative;
      height: 180px; margin-bottom: 12px;
    }
    video { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 100%; min-height: 100%; object-fit: cover; }
    
    .scan-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; height: 50px; border: 2px solid #fff; border-radius: 4px;
      box-shadow: 0 0 0 999px rgba(0,0,0,0.6); pointer-events: none;
    }

    button { padding: 14px; border-radius: 10px; font-weight: 700; font-family: var(--font-din); cursor: pointer; background: #fff; border: 1px solid #ddd; width: 100%; }
    button.primary { background: var(--primary); color: #fff; border: none; }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    canvas { width: 100%; border: 1px solid red; display: none; margin-top: 10px; border-radius: 8px; }
    .show-debug canvas { display: block; }
    
    details { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px; }
    textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="wrap">
  <div id="resultCard" class="result-card">
    <div class="res-label">System Mapping</div>
    <div id="outputVal" class="res-value">READY</div>
  </div>

  <div class="cam-card">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-guide"></div>
  </div>

  <div class="controls">
    <button id="btnScan" class="primary">MANUAL SCAN</button>
    <button id="btnAuto">STOP AUTO</button>
  </div>

  <details>
    <summary>Lists / Sync</summary>
    <button onclick="fetchMapping()" style="margin-top:10px;">SYNC CSV FROM GITHUB</button>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px;">
      <textarea id="listA" rows="5"></textarea>
      <textarea id="listB" rows="5"></textarea>
    </div>
  </details>

  <details>
    <summary>OCR Settings</summary>
    <div style="font-size:12px; margin-top:10px;">
      <label>Contrast Boost</label>
      <input type="range" id="contrast" min="0" max="60" value="35">
      <label><input type="checkbox" id="debugCheck"> Show Processed Stream</label>
    </div>
  </details>

  <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  const el = (id) => document.getElementById(id);
  const video = el('video');
  const canvas = el('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  let worker = null;
  let timer = null;
  let busy = false;
  let auto = true;
  
  // IT Manager Defaults
  let config = {
    scanIntervalMs: 800,
    successLockMs: 3000,
    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-."
  };

  async function boot() {
    el('outputVal').textContent = "LOADING...";
    
    // 1. Fetch JSON Config
    try {
      const res = await fetch('settings.json');
      if(res.ok) config = {...config, ...(await res.json())};
    } catch(e) {}

    // 2. Setup Tesseract for DIN 1451 specifics
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: config.tessedit_char_whitelist,
      tessedit_pageseg_mode: '7', // Single line mode
    });

    // 3. Load Data
    const savedA = localStorage.getItem('mapA');
    if(savedA) {
      el('listA').value = savedA;
      el('listB').value = localStorage.getItem('mapB');
    } else {
      await fetchMapping();
    }

    // 4. Start Video
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        el('outputVal').textContent = "READY";
        startAuto();
      };
    } catch(e) { el('outputVal').textContent = "CAM ERROR"; }
  }

  async function scan() {
    if(busy || !worker) return;
    busy = true;

    const w = video.videoWidth, h = video.videoHeight;
    const sw = w * 0.7, sh = h * 0.12; // Narrower slit for DIN stability
    const sx = (w - sw) / 2, sy = (h - sh) / 2;

    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

    // Pre-processing for High Legibility
    const img = ctx.getImageData(0, 0, sw, sh);
    const d = img.data;
    const boost = (parseInt(el('contrast').value) + 100) / 100;
    
    for(let i=0; i<d.length; i+=4) {
      let v = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
      v = (v - 128) * boost + 128; // Contrast
      d[i] = d[i+1] = d[i+2] = v > 150 ? 255 : 0; // Hard Binarization for DIN 1451
    }
    ctx.putImageData(img, 0, 0);

    try {
      const { data: { text } } = await worker.recognize(canvas);
      const clean = text.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const listA = el('listA').value.split('\n').map(x => x.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
      const idx = listA.findIndex(val => val && val.length > 2 && clean.includes(val));

      if(idx > -1) {
        foundMatch(el('listB').value.split('\n')[idx]);
      }
    } catch(e) {}
    busy = false;
  }

  function foundMatch(val) {
    el('outputVal').textContent = val;
    el('resultCard').className = "result-card success";
    if(auto) {
      clearInterval(timer);
      setTimeout(() => { if(auto) startAuto(); }, config.successLockMs);
    }
  }

  function startAuto() {
    if(timer) clearInterval(timer);
    timer = setInterval(scan, config.scanIntervalMs);
    auto = true;
    el('btnAuto').textContent = "STOP AUTO";
  }

  function stopAuto() {
    clearInterval(timer);
    timer = null;
    auto = false;
    el('btnAuto').textContent = "START AUTO";
  }

  async function fetchMapping() {
    try {
      const r = await fetch('mapping.csv?t=' + Date.now());
      if(r.ok) {
        const txt = await r.text();
        const lines = txt.split(/\r?\n/).filter(x => x.includes(','));
        const a = [], b = [];
        lines.forEach(l => {
          const p = l.split(',');
          a.push(p[0].trim()); b.push(p[1].trim());
        });
        el('listA').value = a.join('\n');
        el('listB').value = b.join('\n');
        localStorage.setItem('mapA', el('listA').value);
        localStorage.setItem('mapB', el('listB').value);
      }
    } catch(e) {}
  }

  el('debugCheck').onchange = (e) => {
    if(e.target.checked) document.body.classList.add('show-debug');
    else document.body.classList.remove('show-debug');
  };
  el('btnAuto').onclick = () => auto ? stopAuto() : startAuto();
  el('btnScan').onclick = scan;
  
  window.onload = boot;
</script>
</body>
</html>
